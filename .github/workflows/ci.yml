name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  # ── preconditions ──────────────────────────────────────────────────────────

  changelog-updated:
    name: Changelog Updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changelog entry exists and is dated
        run: |
          VERSION=$(awk -F'"' '/^version :=/{print $2; exit}' build.sbt)
          test -n "$VERSION"
          grep -F "## [$VERSION]" CHANGELOG.md
          grep -F "[$VERSION]:" CHANGELOG.md
          # Only enforce today's date when this PR bumps the version vs main
          MAIN_VERSION=$(git show origin/main:build.sbt 2>/dev/null | awk -F'"' '/^version :=/{print $2; exit}')
          # ...and not when the branch is an already-released version being merged
          # back: $VERSION is then the most recent tag reachable from HEAD, the
          # release happened on its own date, and demanding today's date would
          # mean falsifying the changelog to get the merge through.
          git fetch --tags --quiet 2>/dev/null || true
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ "$VERSION" != "$MAIN_VERSION" ] && \
             [ "${LATEST_TAG#v}" != "$VERSION" ] && \
             ! echo "${{ github.event.pull_request.title }}" | grep -q '^Draft:'; then
            grep -F "## [$VERSION] - $(TZ=UTC date +%Y-%m-%d)" CHANGELOG.md
          fi

  version-not-tagged:
    name: Version Not Yet Tagged
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag does not already exist for new versions
        run: |
          VERSION=$(awk -F'"' '/^version :=/{print $2; exit}' build.sbt)
          test -n "$VERSION"
          git fetch --tags
          MAIN_VERSION=$(git show origin/main:build.sbt 2>/dev/null | awk -F'"' '/^version :=/{print $2; exit}')
          # Only fail if this branch bumps the version and the tag already exists
          if [ "$VERSION" != "$MAIN_VERSION" ] && git tag | grep -q "^${VERSION}$"; then
            # ...unless $VERSION is the most recent tag reachable from HEAD. That
            # means this branch IS the release that produced the tag and is being
            # merged back — not an attempt to reuse a published version. Without
            # this the gate blocks exactly the merge that keeps main in sync with
            # what was published. menger-common hit this: 0.1.6 went to Maven
            # Central from a branch that could then never be merged back.
            #
            # "most recent reachable tag" rather than merely "an ancestor": every
            # older release tag is also an ancestor, so an ancestor test would
            # happily accept build.sbt being reverted to an already-published
            # version, which is the very thing this gate exists to catch.
            #
            # The leading "v" is stripped because optix-jni carries both 0.1.19
            # and v0.1.19 style tags and git describe may return either. This
            # block is kept byte-identical across repos so it can later become a
            # single reusable workflow.
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ "${LATEST_TAG#v}" = "$VERSION" ]; then
              echo "Tag $VERSION is the latest tag reachable from HEAD — merging the release back, allowed"
            else
              echo "ERROR: Tag $VERSION already exists (latest reachable tag is ${LATEST_TAG:-none})"
              exit 1
            fi
          fi

  create-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      need_release: ${{ steps.tag.outputs.need_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push tag if version changed
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(awk -F'"' '/^version :=/{print $2; exit}' build.sbt)
          echo "Version in build.sbt: $VERSION"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
            # Self-heal (menger 3.6 pattern): a tag without a published Release means
            # a previous run created the tag but its publish never fired — a tag push
            # from CI cannot trigger the tag-ref workflow. Signal the publish job to
            # run in THIS run instead of waiting for a tag event that never comes.
            if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "need_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Tag exists but no GitHub Release — publish in-run"
              echo "need_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git config user.email "ci@github-actions.local"
            git config user.name "CI Bot"
            git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "refs/tags/$VERSION"
            echo "Created and pushed tag $VERSION"
            echo "need_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── check ──────────────────────────────────────────────────────────────────

  scalafix:
    name: Scalafix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - run: sbt "scalafix --check"

  archunit:
    name: ArchUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - run: sbt "testOnly *ArchUnit*"

  # ── test ───────────────────────────────────────────────────────────────────

  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - run: sbt coverage test coverageReport coverageAggregate

  # ── build ──────────────────────────────────────────────────────────────────

  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: [unit-tests, scalafix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - run: sbt package
      - uses: actions/upload-artifact@v4
        with:
          name: menger-common-jar
          path: target/scala-3*/menger-common*.jar

  # ── publish ────────────────────────────────────────────────────────────────

  publish:
    name: Publish to Maven Central + GitHub Release
    runs-on: ubuntu-latest
    # Tag refs publish directly (manual tags). On main pushes, publish in-run when
    # create-tag just tagged or a prior tag never got its release (self-heal) — a
    # CI-pushed tag cannot trigger the tag-ref workflow.
    needs: [build-jar, create-tag]
    # always(): create-tag is skipped on tag refs, and a skipped need would otherwise
    # block publish even when the tag-ref branch of the condition is true.
    if: >-
      always() && (
      startsWith(github.ref, 'refs/tags/') ||
      needs.create-tag.outputs.need_release == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
      - name: Publish to Maven Central
        # Central presence is the source of truth: sonatypeBundleRelease's
        # status-poll can hit a transient read-timeout *after* the bundle
        # already landed (see 0.1.6). Retry, but short-circuit whenever the
        # artifact is actually on Central so a flaky poll can't red a good
        # publish, and a genuine upload failure still exits 1.
        # ponytail: 3 attempts; if Central sync ever lags >attempts, bump the loop.
        run: |
          VERSION=$(awk -F'"' '/^version :=/{print $2; exit}' build.sbt)
          URL="https://repo1.maven.org/maven2/io/github/lene/menger-common_3/${VERSION}/menger-common_3-${VERSION}.pom"
          for attempt in 1 2 3; do
            if curl -sf "$URL" > /dev/null 2>&1; then
              echo "Version ${VERSION} already on Central — publish succeeded"
              exit 0
            fi
            echo "Publish attempt ${attempt}/3"
            sbt publishSigned sonatypeBundleRelease && exit 0
            echo "sbt exited non-zero; re-checking Central before retrying..."
            sleep 30
          done
          curl -sf "$URL" > /dev/null 2>&1 && \
            { echo "Version ${VERSION} on Central despite sbt error"; exit 0; }
          echo "Publish failed: ${VERSION} not on Central after 3 attempts"
          exit 1
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: GitHub Release
        # Idempotent (view-then-create): works on tag refs and main in-run publishes
        # alike — no tag_name/ref_name trap (action-gh-release failed the 0.2.0 run on
        # exactly that), and re-runs after a partial failure are safe.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(awk -F'"' '/^version :=/{print $2; exit}' build.sbt)
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping"
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --notes-file CHANGELOG.md target/scala-3*/menger-common*.jar
          fi

  # ── post-publish verification ───────────────────────────────────────────────

  post-publish-smoke:
    name: Post-Publish Smoke Test (Maven Central)
    runs-on: ubuntu-latest
    needs: [publish]
    if: needs.publish.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Wait for Maven Central sync
        run: |
          VERSION=$(awk -F'"' '/^version :=/{print $2; exit}' build.sbt)
          URL="https://repo1.maven.org/maven2/io/github/lene/menger-common_3/${VERSION}/menger-common_3-${VERSION}.pom"
          for i in $(seq 1 20); do
            if curl -sf "$URL" > /dev/null 2>&1; then
              echo "Artifact available on Maven Central"
              exit 0
            fi
            echo "Not yet available (attempt $i/20), waiting 30s..."
            sleep 30
          done
          echo "ERROR: Artifact not available after 10 minutes"
          exit 1
      - name: Run Java smoke test against published artifact
        run: |
          VERSION=$(awk -F'"' '/^version :=/{print $2; exit}' build.sbt)
          cd smoke-tests/java
          mvn test -Dmenger.version=$VERSION
