name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  # ── preconditions ──────────────────────────────────────────────────────────

  changelog-updated:
    name: Changelog Updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changelog entry exists and is dated
        run: |
          VERSION=$(grep 'version :=' build.sbt | cut -d'"' -f2)
          test -n "$VERSION"
          grep -F "## [$VERSION]" CHANGELOG.md
          grep -F "...$VERSION" CHANGELOG.md
          if ! echo "${{ github.event.pull_request.title }}" | grep -q '^Draft:'; then
            grep -F "## [$VERSION] - $(date +%Y-%m-%d)" CHANGELOG.md
          fi

  version-not-tagged:
    name: Version Not Yet Tagged
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag does not already exist
        run: |
          VERSION=$(grep 'version :=' build.sbt | cut -d'"' -f2)
          test -n "$VERSION"
          git fetch --tags
          if git tag | grep -q "^${VERSION}$"; then
            echo "ERROR: Tag $VERSION already exists"
            exit 1
          fi

  # ── check ──────────────────────────────────────────────────────────────────

  scalafix:
    name: Scalafix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - run: sbt "scalafix --check"

  archunit:
    name: ArchUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - run: sbt "testOnly *ArchUnit*"

  # ── test ───────────────────────────────────────────────────────────────────

  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - run: sbt coverage test coverageReport coverageAggregate

  # ── build ──────────────────────────────────────────────────────────────────

  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: [unit-tests, scalafix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - run: sbt package
      - uses: actions/upload-artifact@v4
        with:
          name: menger-common-jar
          path: target/scala-3*/menger-common*.jar

  # ── publish ────────────────────────────────────────────────────────────────

  publish:
    name: Publish to Maven Central + GitHub Release
    runs-on: ubuntu-latest
    needs: [build-jar]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
      - name: Publish to Maven Central
        run: sbt publishSigned sonatypeBundleRelease
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - uses: softprops/action-gh-release@v2
        with:
          files: target/scala-3*/menger-common*.jar
          generate_release_notes: false
          body_path: CHANGELOG.md
